        description:
          type: string
          minLength: 1
          maxLength: 300
        media:
          type: [array, 'null']
          maxItems: 3
          items:
            type: string

    AftersaleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
