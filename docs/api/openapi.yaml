            - $ref: '#/components/schemas/CleanTier'
            - type: 'null'
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time

    Aftersale:
      type: object
      required: [id, phone, inWarranty, description, status, notifyStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: A20261005-001
        phone:
          type: string
        orderId:
          type: [string, 'null']
        inWarranty:
          type: boolean
        description:
          type: string
        media:
          type: [array, 'null']
          items:
            type: string
        status:
          $ref: '#/components/schemas/AftersaleStatus'
        remark:
          type: [string, 'null']
        notifyStatus:
          $ref: '#/components/schemas/NotifyStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        order:
          oneOf:
            - $ref: '#/components/schemas/AftersaleOrderRef'
            - type: 'null'

    AftersaleCreateResponse:
      type: object
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: ok
        data:
          type: object
          properties:
            aftersaleId:
              type: string
            matchedOrderId:
              type: [string, 'null']
            inWarranty:
              type: boolean
            etaText:
              type: string

    AftersaleDetailResponse:
      type: object
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: ok
        data:
          $ref: '#/components/schemas/Aftersale'

    AftersalePageResponse:
      type: object
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: ok
        data:
          type: object
          properties:
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/Aftersale'

    LookupResponse:
      type: object
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: ok
        data:
          type: object
          required: [found]
          properties:
            found:
              type: boolean
            orderId:
              type: string
            serviceType:
              $ref: '#/components/schemas/ServiceType'
            cleanTier:
              oneOf:
                - $ref: '#/components/schemas/CleanTier'
